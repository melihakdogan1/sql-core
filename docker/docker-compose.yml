services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_core_pg
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ecommerce_oltp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d ecommerce_oltp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: